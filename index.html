<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CUET PG Study Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column "lab notebook": header with progress, sticky tab bar, then a single working view. Signature element: the 18-week strip, one cell per week, filled like a stained slide. */
:root{
  --bg:#f5f4fa; --surface:#ffffff; --surface2:#eceaf5; --ink:#1c1a2e; --muted:#5f5b77;
  --line:#dedaec; --line2:#b9b3d0;
  --accent:#4636a6; --accent-ink:#ffffff; --eo:#c2255c;
  --ok:#1d7f49; --warn:#a15c00; --bad:#b42318;
  --t1:#4636a6; --t2:#0b6f66; --tF:#b42318; --tL:#3b7a1c; --tM:#9a5400; --all:#3a3650; --rev:#4f6180;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111d; --surface:#1c1a2b; --surface2:#262338; --ink:#ecebf7; --muted:#a6a2bd;
    --line:#35314c; --line2:#4d486b;
    --accent:#a99dff; --accent-ink:#17122e; --eo:#ff7fa8;
    --ok:#63d391; --warn:#f0b45a; --bad:#ff8a7a;
    --t1:#a99dff; --t2:#4fd1c0; --tF:#ff8a7a; --tL:#9ad06a; --tM:#f0b45a; --all:#d2cee8; --rev:#a3b4d1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13111d; --surface:#1c1a2b; --surface2:#262338; --ink:#ecebf7; --muted:#a6a2bd;
  --line:#35314c; --line2:#4d486b;
  --accent:#a99dff; --accent-ink:#17122e; --eo:#ff7fa8;
  --ok:#63d391; --warn:#f0b45a; --bad:#ff8a7a;
  --t1:#a99dff; --t2:#4fd1c0; --tF:#ff8a7a; --tL:#9ad06a; --tM:#f0b45a; --all:#d2cee8; --rev:#a3b4d1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:18px}
.brand{min-width:0;flex:1 1 320px}
.brand h1{font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.05;margin-top:8px}
.brand p{margin:6px 0 0;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--muted);margin-top:10px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="fail"] i{background:var(--bad)}
.kpis{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;flex:1 1 360px;justify-content:flex-end}
.kpi{min-width:0}
.kpi b{display:block;font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.big{flex:1 1 220px}
.kpi.big b{font-size:44px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.thin{height:6px;margin-top:0}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* generic */
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card+.card{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.card h2{font-size:20px;font-weight:650}
.card h3{font-size:15px;font-weight:650}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.chip{--c:var(--muted);display:inline-block;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);white-space:normal}
.c-t1{--c:var(--t1)}.c-t2{--c:var(--t2)}.c-tF{--c:var(--tF)}.c-tL{--c:var(--tL)}.c-tM{--c:var(--tM)}.c-all{--c:var(--all)}.c-rev{--c:var(--rev)}.c-sun{--c:var(--rev)}
.chip.c-mock{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.warn{--c:var(--warn)}.chip.eo{--c:var(--eo)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:62px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

/* check */
.chk{display:grid;place-items:center;padding:8px;margin:-8px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid var(--line2);border-radius:6px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.chk input::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .12s}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{transform:rotate(45deg) scale(1)}
.chk input:disabled{opacity:.35;cursor:not-allowed}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px}
.cell{position:relative;height:46px;border:1px solid var(--line2);border-radius:5px;background:var(--surface);padding:0;overflow:hidden;text-align:left}
.cell i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.85}
.cell.buf{border-style:dashed}
.cell.now{outline:2px solid var(--eo);outline-offset:1px}
.cell span{position:absolute;top:3px;left:0;right:0;text-align:center;font:600 10px var(--f-mono);color:var(--ink);mix-blend-mode:normal}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--muted)}
@media (max-width:560px){.strip{grid-template-columns:repeat(9,minmax(0,1fr))}}

/* readiness */
.ready{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.ready .code{font:600 12px var(--f-mono);color:var(--muted)}
.ready .nm{font-weight:600}
.ready .v{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}

/* today card */
.today-card h2{font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.15;margin:8px 0 10px}
.blocks{display:flex;flex-direction:column;gap:2px;margin:14px 0}
.blk{display:grid;grid-template-columns:auto 118px minmax(0,1fr);gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.blk:last-child{border-bottom:1px solid var(--line)}
.blk .bt{font:500 12px var(--f-mono);color:var(--muted)}
.blk .bn b{font-weight:650}
.blk .bn em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.blk.on .bn b{text-decoration:line-through;text-decoration-color:var(--line2)}
@media (max-width:460px){.blk{grid-template-columns:auto minmax(0,1fr)}.blk .bt{grid-column:2;grid-row:1}.blk .bn{grid-column:2}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.plan-in{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.plan-in .topic{flex:1 1 240px}

/* lists */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini .d{font:500 12px var(--f-mono);color:var(--muted)}
.mini .tx{min-width:0;overflow-wrap:anywhere}
.mini .mb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:460px){.mini li{grid-template-columns:54px minmax(0,1fr)}.mini .mb{grid-column:2;justify-content:flex-start}}

/* plan */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week+.week{margin-top:12px}
.wk-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:14px 16px}
.wk-h:hover{background:var(--surface2)}
.wk-h .t{min-width:0}
.wk-h .t b{font:650 16px var(--f-display);display:block}
.wk-h .t span{font-size:13px;color:var(--muted)}
.wk-h .p{font:600 12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chev{width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s;margin-right:4px}
.week.open .chev{transform:rotate(-135deg)}
@media (max-width:560px){.wk-h{grid-template-columns:minmax(0,1fr) auto}.wk-h .bw{display:none}}
.wk-b{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:22px 54px minmax(0,1fr) auto;gap:14px;align-items:start;padding:11px 16px;border-top:1px solid var(--line);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.today{background:color-mix(in srgb,var(--eo) 7%,var(--surface));border-left-color:var(--eo)}
.row.missed{border-left-color:var(--warn)}
.row.sun .topic-t{color:var(--muted)}
.row.done .topic-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.row.moved .topic-t{color:var(--muted);text-decoration:line-through}
.when{display:flex;flex-direction:column;font:500 11px/1.25 var(--f-mono);color:var(--muted)}
.when b{font-weight:600;color:var(--ink);font-size:12px}
.topic-t{font-weight:500;overflow-wrap:anywhere}
.row .topic{width:100%}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.meta select{padding:3px 6px;font-size:12px}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--accent)}
.more{background:none;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.more:hover{border-color:var(--accent);color:var(--accent)}
.more .chev{margin:-3px 0 0 0;width:8px;height:8px}
.more[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:3px}
.detail{padding:4px 16px 16px 106px;background:var(--surface2)}
@media (max-width:560px){.detail{padding-left:16px}.row{gap:10px;padding-inline:12px}}
.detail .blocks{margin-top:6px}
.starbtn[aria-pressed="true"]{border-color:var(--eo);color:var(--eo)}

/* pool */
.pool{list-style:none;margin:0;padding:0}
.pool li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pool li:first-child{border-top:0}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.addrow input{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--ink)}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

/* mocks */
.mrow{display:grid;grid-template-columns:70px minmax(0,1fr) 84px 84px 84px 70px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .lb{min-width:0;overflow-wrap:anywhere}
.mrow .lb small{display:block;color:var(--muted)}
.mrow input{width:100%}
.mrow .nt{grid-column:2 / -1}
.mhead{display:grid;grid-template-columns:70px minmax(0,1fr) 84px 84px 84px 70px;gap:10px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
@media (max-width:700px){
  .mhead{display:none}
  .mrow{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mrow .d,.mrow .lb,.mrow .nt{grid-column:1 / -1}
  .mrow .pc{grid-column:1 / -1}
}
.pct{font:700 14px var(--f-mono);font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;gap:12px 32px;margin-bottom:14px}
.sum b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 11px var(--f-mono);fill:var(--muted)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .pv{fill:var(--ink);font-weight:600}

/* syllabus */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tiers .card+.card{margin-top:0}
.tiers ul{margin:10px 0 0;padding-left:18px}
.tiers li{margin:4px 0}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.unit .v{font:600 12px var(--f-mono);text-align:right}
@media (max-width:460px){.unit{grid-template-columns:minmax(0,1fr) 70px 44px}}

.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.foot .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);padding:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var docRef=null,remoteReady=false,writing=false,dirty=false,saveTimer=null,softTimer=null,syncMode='local';
var SYNCTXT={local:'Saved on this device only',ok:'Synced to your account',saving:'Saving…',fail:'Sync failed, saved on this device'};

async function flush(){
  if(!docRef||!remoteReady)return;
  if(writing){dirty=true;return}
  writing=true;
  try{do{dirty=false;await docRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt});}while(dirty);setSync('ok');}
  catch(e){setSync('fail')}

}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    var u=await window.claude.use('user'),db=await window.claude.use('db');
    if(!u||!db){setSync('local');return}
    var uid=await u.id(); if(!uid){setSync('local');return}
    docRef=db.doc('data/users/'+uid+'/tracker');
    setSync('saving');
    docRef.onSnapshot(function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(!snap.exists){
        if(snap.metadata&&snap.metadata.fromCache)return;
        remoteReady=true; if(S.updatedAt)flush(); else setSync('ok'); return;
      }
      if(!(snap.metadata&&snap.metadata.fromCache))remoteReady=true;
      var data=snap.data()||{},r;
      try{r=JSON.parse(data.json)}catch(e){return}
      var ru=+data.updatedAt||0;
      if(ru>S.updatedAt){S=normalize(r);S.updatedAt=ru;saveLocal();renderAll();setSync('ok')}
      else if(S.updatedAt>ru){if(remoteReady)scheduleRemote()}
      else setSync('ok');
    },function(){docRef=null;setSync('local')});
  }catch(e){setSync('local')}
}

function mockChart(){

  var path=pts.map(function(e,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(mpct(e.id)).toFixed(1)}).join(' ');

    var sb=box&&box.querySelectorAll('input[data-act="blk"]');if(sb)[].forEach.call(sb,function(x){x.disabled=!t.value.trim()});
    var b2=box&&box.querySelector('[data-act="done2"]');if(b2)b2.disabled=!t.value.trim();
    touchSoon();renderHead();
  }
  else if(a==='note'){mut(k).note=t.value;touchSoon()}
  else if(a==='m'){var r=S.mocks[t.dataset.id]||(S.mocks[t.dataset.id]={});r[t.dataset.f]=t.value;touchSoon();liveMocks()}
  else if(a==='mtot'){var v=parseFloat(t.value);if(v>0){S.mockTotal=v;touchSoon();liveMocks()}}
});
